{% extends "layout.html" %}

{% block title %}Signup{% endblock %}

{% block content %}
<h1>Signup</h1>
<form method="POST" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Signup</button>
</form>
<a href="{% url 'login' %}">Already have an account? Login</a>
{% endblock %}
