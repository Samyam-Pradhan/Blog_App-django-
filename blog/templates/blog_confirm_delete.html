{% extends "layout.html" %}

{% block title %}Delete Blog{% endblock %}

{% block content %}
<h1>Delete Blog</h1>
<p>Are you sure you want to delete this blog?</p>
<p><strong>{{ blog.text }}</strong></p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'blog_list' %}">Cancel</a>
</form>
{% endblock %}
